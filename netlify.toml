# Zentic Health — Netlify deployment configuration
# How it works: @netlify/plugin-nextjs rewrites the Next.js 14 App Router output
# into Netlify Functions + Edge Functions, so SSR, dynamic routes, and middleware
# all work without any Vercel-specific infrastructure.
#
# To deploy:
#   1. Connect the GitHub repo (tayyebns/ZenticHealthDemoMVP) in the Netlify UI.
#   2. Netlify auto-detects these settings — no manual changes needed in the UI.
#   3. Hit "Deploy site". Done.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers. Content-Security-Policy is intentionally NOT set here:
# it needs a per-request nonce (to allow Next.js's own hydration scripts
# while still blocking injected/tampered scripts), which a static file can't
# provide. That header is set dynamically in src/middleware.ts instead.
#
# HTTPS enforcement: Netlify auto-provisions TLS and forces HTTPS by default
# for both *.netlify.app subdomains and attached custom domains. Once a
# custom domain is attached, confirm "Force HTTPS" is enabled under
# Site settings > Domain management > HTTPS in the Netlify dashboard, since
# that toggle lives outside this repo and can't be verified from the codebase.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
